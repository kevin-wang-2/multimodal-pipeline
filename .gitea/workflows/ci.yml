# 合并门禁：Linux 契约/单测 + Windows GPU 真模型冒烟。
# main push 两项成功后，同一台 Windows runner 才部署 C:\mmp\repo 并健康检查。
#
# 本实例的 runner 访问不到 github.com，不用 actions/*；检出按本实例惯例手工 git fetch。
# runner 镜像 docker.gitea.com/runner-images:ubuntu-latest 自带 Python 3.12、Node 24、git。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mmp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_RETRIES: "5"
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple   # runner 到 files.pythonhosted.org 频繁读超时（run 902 / 985）
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q -f FETCH_HEAD

      - name: Toolchain
        run: |
          python3 --version
          node --version
          python3 -m venv .venv || (apt-get update -qq && apt-get install -y -qq python3-venv && python3 -m venv .venv)
          .venv/bin/python -m pip install -q --upgrade pip
          npm install -g --silent pnpm@10
          pnpm --version

      - name: Install python deps
        run: .venv/bin/pip install -q -e "node[dev]" -r protocol/tests/py/requirements.txt

      - name: Contract tests (jsonschema)
        run: ../../../.venv/bin/python -m pytest -q
        working-directory: protocol/tests/py

      - name: Contract tests (ajv)
        run: |
          pnpm install --frozen-lockfile
          pnpm test
        working-directory: protocol/tests/ts

      - name: ts workspace - build, generated types fresh, tests (protocol + B-ts scenarios)
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          pnpm gen-types
          git diff --exit-code -- packages/protocol/src/types.ts || (echo "types.ts is stale: run pnpm gen-types and commit" && exit 1)
          pnpm -r test
          pnpm release:pack && ls -la dist-packs
        working-directory: ts

      - name: Node acceptance (A + B-py echo, B-py scenarios, A ws client vs real B-ts)
        run: ../.venv/bin/python -m pytest -q
        working-directory: node

  smoke:
    runs-on: windows
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PY_NODE: C:\ProgramData\miniconda3\envs\mmp-node\python.exe
      MMP_ENGINE_PYTHON: C:\ProgramData\miniconda3\envs\mmp-audio\python.exe
      MMP_MODELS_DIR: C:\mmp\models
      MMP_SMOKE_WAVS: C:\mmp\testdata
      MMP_OCR_PYTHON: C:\ProgramData\miniconda3\envs\ocrlab\python.exe
      MMP_OCR_INVOICES: C:\mmp\invoices
      MMP_IMAGE_PYTHON: C:\mmp\envs\vision-spike-venv\Scripts\python.exe
      MMP_FLORENCE_BASE: C:\mmp\cache\vision-spike\models\Florence-2-base-ft-native
      MMP_FLORENCE_LARGE: C:\mmp\cache\vision-spike\models\Florence-2-large-ft-native
      MMP_SMOKE_IMAGES: C:\mmp\testdata\images
      MMP_SMOKE_DOCUMENT: C:\mmp\invoices\20260105_202507_12_2396_\p-001.png
      PADDLE_PDX_CACHE_HOME: C:\mmp\paddlex
      PADDLE_PDX_MODEL_SOURCE: modelscope
    steps:
      - name: Checkout
        shell: cmd
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          @echo off
          git init -q .
          git remote remove origin 2>nul
          git remote add origin %GITHUB_SERVER_URL%/%GITHUB_REPOSITORY%.git
          git -c http.extraHeader="Authorization: token %TOKEN%" fetch -q --depth 1 origin %GITHUB_SHA%
          git checkout -q -f FETCH_HEAD
      - name: GPU visible
        shell: cmd
        run: nvidia-smi
      - name: Install node package into mmp-node env
        shell: cmd
        run: |
          @echo off
          %PY_NODE% --version
          %PY_NODE% -m pip install -q -e "node[dev]" || exit /b 1
          %MMP_ENGINE_PYTHON% -c "import sherpa_onnx, onnxruntime; print('engine env ok', sherpa_onnx.__version__)" || exit /b 1
          %MMP_IMAGE_PYTHON% -c "import torch, transformers, PIL; print('image env ok', torch.__version__, transformers.__version__)" || exit /b 1
      - name: Build ts workspace (B-ts for the ws integration test)
        shell: cmd
        working-directory: ts
        run: |
          @echo off
          node --version
          call pnpm --version
          call pnpm install --frozen-lockfile || exit /b 1
          call pnpm -r build || exit /b 1
          dir packages\broker\dist\cli.js || exit /b 1
      - name: Node acceptance on Windows (echo + triage.audio real model + ws vs B-ts)
        shell: cmd
        working-directory: node
        run: '%PY_NODE% -m pytest -q -p no:cacheprovider'
      - name: Real-model smoke on M0 clips
        shell: cmd
        run: |
          @echo off
          if not exist ci-out mkdir ci-out
          set MMP_SMOKE_DUMP=ci-out
          %PY_NODE% node\tools\smoke_triage_audio.py || exit /b 1
      - name: triage.image real-model smoke
        shell: cmd
        run: '%PY_NODE% node\tools\smoke_triage_image.py || exit /b 1'
      - name: ocr.structured smoke
        shell: cmd
        run: |
          @echo off
          %MMP_OCR_PYTHON% node\engines\ocr_structured\setup_env.py verify --env ocrlab || exit /b 1
          %PY_NODE% node\tools\smoke_ocr_structured.py || exit /b 1

  deploy-node:
    needs: [unit, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows
    timeout-minutes: 15
    steps:
      - name: Checkout deployment script
        shell: cmd
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          @echo off
          git init -q .
          git remote remove origin 2>nul
          git remote add origin %GITHUB_SERVER_URL%/%GITHUB_REPOSITORY%.git
          git -c http.extraHeader="Authorization: token %TOKEN%" fetch -q --depth 1 origin %GITHUB_SHA%
          git checkout -q -f FETCH_HEAD
      - name: Deploy exact main SHA to mmp-node
        shell: cmd
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\deploy\windows-node.ps1 -ExpectedSha "${{ github.sha }}" -RepositoryUrl "%GITHUB_SERVER_URL%/%GITHUB_REPOSITORY%.git" -Token "%TOKEN%"
