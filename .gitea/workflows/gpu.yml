# gpu：GPU 机上的 windows runner（标签 `windows`，Windows + miniconda，RTX 5070 Ti）。S2 起跑真模型冒烟。
# 注意 Windows runner 的 run: 块必须是纯 ASCII（cmd.exe 按 GBK 读 UTF-8 脚本会截断）；说明只写在 YAML 注释里。
name: gpu
on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - "protocol/**"
      - ".gitea/workflows/gpu.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows
    timeout-minutes: 30
    steps:
      - name: Checkout
        shell: cmd
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          @echo off
          git init -q .
          git remote remove origin 2>nul
          git remote add origin %GITHUB_SERVER_URL%/%GITHUB_REPOSITORY%.git
          git -c http.extraHeader="Authorization: token %TOKEN%" fetch -q --depth 1 origin %GITHUB_SHA%
          git checkout -q -f FETCH_HEAD
      - name: GPU visible
        shell: cmd
        run: nvidia-smi
      - name: Toolchain
        shell: cmd
        run: |
          @echo off
          where python
          python --version
          where conda && conda --version
      - name: Real-model smoke (replaced in S2 by triage.audio on M0 clips)
        shell: cmd
        run: echo S2 placeholder - triage.audio smoke goes here
