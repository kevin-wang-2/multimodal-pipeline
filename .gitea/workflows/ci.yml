# unit：任意 linux runner。协议契约测试（py + ts）+ A / B-py 验收测试（echo 引擎，无模型）。
#
# 本实例的 runner 访问不到 github.com，不用 actions/*；检出按本实例惯例手工 git fetch。
# runner 镜像 docker.gitea.com/runner-images:ubuntu-latest 自带 Python 3.12、Node 24、git。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mmp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_RETRIES: "5"
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple   # runner 到 files.pythonhosted.org 频繁读超时（run 902 / 985）
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git remote add origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q -f FETCH_HEAD

      - name: Toolchain
        run: |
          python3 --version
          node --version
          python3 -m venv .venv || (apt-get update -qq && apt-get install -y -qq python3-venv && python3 -m venv .venv)
          .venv/bin/python -m pip install -q --upgrade pip
          npm install -g --silent pnpm@10
          pnpm --version

      - name: Install python deps
        run: .venv/bin/pip install -q -e "node[dev]" -r protocol/tests/py/requirements.txt

      - name: Contract tests (jsonschema)
        run: ../../../.venv/bin/python -m pytest -q
        working-directory: protocol/tests/py

      - name: Contract tests (ajv)
        run: |
          pnpm install --frozen-lockfile
          pnpm test
        working-directory: protocol/tests/ts

      - name: ts workspace - build, generated types fresh, tests (protocol + B-ts scenarios)
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          pnpm gen-types
          git diff --exit-code -- packages/protocol/src/types.ts || (echo "types.ts is stale: run pnpm gen-types and commit" && exit 1)
          pnpm -r test
        working-directory: ts

      - name: Node acceptance (A + B-py echo, B-py scenarios, A ws client vs real B-ts)
        run: ../.venv/bin/python -m pytest -q
        working-directory: node
