# gpu：GPU 机上的 windows runner（标签 `windows`，Windows + miniconda，RTX 5070 Ti）。
# 跑 node 验收（Windows 路径）+ triage.audio 真模型冒烟（M0 素材）。
# 机器上一次性准备（见 node/engines/triage_audio/README.md）：
#   conda env mmp-node（py3.12，装 node[dev]）、mmp-audio（py3.12 + sherpa-onnx/onnxruntime/numpy）
#   C:\mmp\models 三件套、C:\mmp\testdata 两段 M0 素材；conda env ocrlab（node/engines/ocr_structured/setup_env.py）与 T5 发票素材（不进仓库）
# runner 以服务账号运行，~ 不是 Admin 且没权限进 Admin 主目录：模型缓存复制到 C:\mmp\paddlex（icacls 给 Users 修改权），PADDLE_PDX_CACHE_HOME 指过去。
# 注意 Windows runner 的 run: 块必须是纯 ASCII（cmd.exe 按 GBK 读 UTF-8 脚本会截断）；说明只写在 YAML 注释里。
# 批处理里调 .cmd 垫片（pnpm / npm / npx）必须写 call，否则控制权转移、后面的行不执行。
name: gpu
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PY_NODE: C:\ProgramData\miniconda3\envs\mmp-node\python.exe
      MMP_ENGINE_PYTHON: C:\ProgramData\miniconda3\envs\mmp-audio\python.exe
      MMP_MODELS_DIR: C:\mmp\models
      MMP_SMOKE_WAVS: C:\mmp\testdata
      MMP_OCR_PYTHON: C:\ProgramData\miniconda3\envs\ocrlab\python.exe
      MMP_OCR_INVOICES: C:\Users\Admin\ocrlab\out\inv
      PADDLE_PDX_CACHE_HOME: C:\mmp\paddlex
      PADDLE_PDX_MODEL_SOURCE: modelscope
    steps:
      - name: Checkout
        shell: cmd
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          @echo off
          git init -q .
          git remote remove origin 2>nul
          git remote add origin %GITHUB_SERVER_URL%/%GITHUB_REPOSITORY%.git
          git -c http.extraHeader="Authorization: token %TOKEN%" fetch -q --depth 1 origin %GITHUB_SHA%
          git checkout -q -f FETCH_HEAD
      - name: GPU visible
        shell: cmd
        run: nvidia-smi
      - name: Install node package into mmp-node env
        shell: cmd
        run: |
          @echo off
          %PY_NODE% --version
          %PY_NODE% -m pip install -q -e "node[dev]" || exit /b 1
          %MMP_ENGINE_PYTHON% -c "import sherpa_onnx, onnxruntime; print('engine env ok', sherpa_onnx.__version__)" || exit /b 1
      - name: Build ts workspace (B-ts for the ws integration test)
        shell: cmd
        working-directory: ts
        run: |
          @echo off
          node --version
          call pnpm --version
          call pnpm install --frozen-lockfile || exit /b 1
          call pnpm -r build || exit /b 1
          dir packages\broker\dist\cli.js || exit /b 1
      - name: Node acceptance on Windows (echo + triage.audio real model + ws vs B-ts)
        shell: cmd
        working-directory: node
        run: '%PY_NODE% -m pytest -q -p no:cacheprovider'
      - name: Real-model smoke on M0 clips
        shell: cmd
        run: |
          @echo off
          if not exist ci-out mkdir ci-out
          set MMP_SMOKE_DUMP=ci-out
          %PY_NODE% node\tools\smoke_triage_audio.py || exit /b 1
      - name: ocr.structured smoke (PP-OCRv6 + PaddleOCR-VL on the T5 invoices, stays on this machine)
        shell: cmd
        run: |
          @echo off
          %MMP_OCR_PYTHON% node\engines\ocr_structured\setup_env.py verify --env ocrlab || exit /b 1
          %PY_NODE% node\tools\smoke_ocr_structured.py || exit /b 1
