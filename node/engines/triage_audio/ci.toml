# Plugin-owned smoke commands; paths are relative to the repository root.
watch = [
  "node/tools/smoke_triage_audio.py",
  "node/tests/test_triage_audio.py",
]
smoke = [
  ["{python}", "-m", "pytest", "-q", "node/tests/test_triage_audio.py", "-m", "real_model"],
  ["{python}", "node/tools/smoke_triage_audio.py"],
]
[env]
MMP_SMOKE_DUMP = "ci-out"
